[main]
font=Dejavu:Sans:Book:size=10
dpi-aware=no
use-bold=yes
icon-theme=Obsidian
anchor=top-left
x-margin=10
y-margin=10
horizontal-pad=20
vertical-pad=10
inner-pad=4
width=20
line-height=22px
lines=18
sort-result=false
fields=name,generic,comment,categories,filename,keywords
terminal=x-terminal-emulator -e
prompt=">    "
placeholder="< type to search >"
show-actions=yes
exit-on-keyboard-focus-loss=no
keyboard-focus=exclusive

[colors]
background=18191AEE
text=BABABAff  
selection=434A4Dfa
selection-match=FF526Efa
input=DBDBDBff
selection-text=D6D6D6ff
border=484C4Ffa
match=C75363fa
prompt=3C9BCFfa
placeholder=6C767Afa
[border]
radius=8
width=1
